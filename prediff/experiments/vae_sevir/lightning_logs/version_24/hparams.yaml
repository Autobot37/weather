layout:
  img_height: 384
  img_width: 384
  layout: NHWC
optim:
  seed: null
  total_batch_size: 32
  micro_batch_size: 8
  float32_matmul_precision: high
  method: adam
  lr: 0.001
  wd: 1.0e-05
  betas:
  - 0.5
  - 0.9
  gradient_clip_val: 1.0
  max_epochs: 50
  warmup_percentage: 0.2
  lr_scheduler_mode: cosine
  min_lr_ratio: 0.001
  warmup_min_lr_ratio: 0.0
  monitor: val/total_loss
  early_stop: false
  early_stop_mode: min
  early_stop_patience: 5
  save_top_k: 1
logging:
  logging_prefix: SEVIR
  monitor_lr: true
  monitor_device: false
  track_grad_norm: -1
  use_wandb: false
trainer:
  check_val_every_n_epoch: 1
  log_step_ratio: 0.001
  precision: 32
  find_unused_parameters: true
  num_sanity_val_steps: 2
eval:
  train_example_data_idx_list:
  - 0
  val_example_data_idx_list:
  - 0
  test_example_data_idx_list:
  - 0
  eval_example_only: false
  num_vis: 10
model:
  data_channels: 1
  down_block_types:
  - DownEncoderBlock2D
  - DownEncoderBlock2D
  - DownEncoderBlock2D
  - DownEncoderBlock2D
  - DownEncoderBlock2D
  in_channels: 1
  sample_size: 384
  block_out_channels:
  - 128
  - 256
  - 512
  - 512
  - 512
  act_fn: silu
  latent_channels: 4
  up_block_types:
  - UpDecoderBlock2D
  - UpDecoderBlock2D
  - UpDecoderBlock2D
  - UpDecoderBlock2D
  - UpDecoderBlock2D
  norm_num_groups: 32
  layers_per_block: 2
  out_channels: 1
  loss:
    disc_start: 50001
    kl_weight: 1.0e-06
    disc_weight: 0.5
    perceptual_weight: 1.0
    disc_in_channels: 1
dataset:
  dataset_name: sevirlr
  img_height: 384
  img_width: 384
  in_len: 0
  out_len: 1
  seq_len: 1
  plot_stride: 1
  sample_mode: sequent
  stride: 1
  layout: NTHWC
  start_date: null
  train_val_split_date:
  - 2019
  - 1
  - 1
  train_test_split_date:
  - 2019
  - 6
  - 1
  end_date: null
  aug_mode: '1'
  val_ratio: 0.1
